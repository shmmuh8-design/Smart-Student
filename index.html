<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطالب الذكي</title>
<meta name="description" content="الطالب الذكي: صوّر درسك واحصل على ملخص وبطاقات مراجعة واختبار قصير قبل الاختبار.">
<meta name="theme-color" content="#2b2a8c">
<script src="config.js"></script>
<style>
@font-face{font-family:"Cairo";src:url(art/cairo.woff) format("woff");font-weight:200 1000;font-display:swap}
@font-face{font-family:"Tajawal";src:url(art/tajawal-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Tajawal";src:url(art/tajawal-700.woff) format("woff");font-weight:700;font-display:swap}
:root{
  --bg:#f4f3ff; --card:#ffffff; --ink:#1d1b4b; --muted:#6b6a92; --line:#e4e2f7;
  --pri:#3b37c9; --pri2:#5b55f0; --sun:#ffc531; --sun2:#ff9f1c; --mint:#1fbf8f; --bad:#e5484d;
  --shadow:0 2px 4px rgba(40,30,120,.06),0 12px 28px rgba(40,30,120,.10);
  --h:"Cairo","Tajawal",Tahoma,sans-serif; --b:"Tajawal","Cairo",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.7 var(--b);min-height:100dvh;
  padding:env(safe-area-inset-top,0) 0 calc(96px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--h);margin:0;line-height:1.35}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* top */
.hero{position:relative;margin:0 -16px 14px;padding:18px 20px 26px;color:#fff;border-radius:0 0 28px 28px;overflow:hidden;
  background:radial-gradient(120% 120% at 100% 0%,#6d66ff 0%,#3b37c9 45%,#2b2a8c 100%)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,49,.45),transparent 70%)}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#ffd75e,#ff9f1c);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.brand .logo svg{width:30px;height:30px}
.brand b{display:block;font:900 1.45rem/1.1 var(--h)}
.brand small{font-size:.82rem;opacity:.85}
.brand .sp{flex:1}
.iconbtn{border:0;background:rgba(255,255,255,.16);color:#fff;width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.hi{position:relative;z-index:1;margin-top:18px}
.hi h1{font-size:1.55rem;font-weight:900}
.hi p{margin:4px 0 0;opacity:.9;font-size:.98rem}
.left{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:.92rem}
.left i{font-style:normal}

/* big actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-4px 0 16px}
.act{border:0;border-radius:22px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;box-shadow:var(--shadow);background:var(--card)}
.act .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem}
.act b{font:800 1.08rem var(--h)}
.act small{color:var(--muted);font-size:.85rem;line-height:1.45}
.act.cam .ic{background:linear-gradient(160deg,#ffd75e,#ff9f1c)}
.act.txt .ic{background:linear-gradient(160deg,#8fe9c9,#1fbf8f)}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:1.15rem;font-weight:800}
.sec small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.empty .big{font-size:2.6rem}

/* lesson list */
.lrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:start}
.lrow .sub{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:1.4rem;background:#eeecff}
.lrow b{display:block;font:800 1rem var(--h)}
.lrow span{display:block;color:var(--muted);font-size:.84rem}
.lrow .sc{margin-inline-start:auto;flex:none;font:800 .9rem var(--h);color:var(--pri);background:#eeecff;padding:3px 10px;border-radius:999px}
.lrow .exam{color:#b45309;background:#fff4d6}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,16,60,.45);display:grid;place-items:end center}
.sheet{background:var(--bg);width:min(560px,100%);max-height:94dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px}
.sheet > *{flex-shrink:0}
.sheet h3{font-size:1.2rem;font-weight:800}
.lbl{font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--pri2)}
textarea.inp{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:16px;padding:14px 16px;font:800 1.02rem var(--h);background:linear-gradient(160deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 8px 18px -6px rgba(59,55,201,.6);width:100%}
.btn.sun{background:linear-gradient(160deg,#ffd75e,#ff9f1c);color:#3b2400;box-shadow:0 8px 18px -6px rgba(255,159,28,.6)}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.55}
.prev{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:#e9e7fb}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:90;max-width:90vw;text-align:center;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* loading */
.loading{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 90% at 50% 20%,#6d66ff,#2b2a8c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc531 45%,#ff9f1c);box-shadow:0 0 60px rgba(255,197,49,.6);animation:bob 1.6s ease-in-out infinite;display:grid;place-items:center;font-size:3rem}
@keyframes bob{50%{transform:translateY(-10px) scale(1.04)}}
.loading h2{font-size:1.35rem;font-weight:900}
.loading p{margin:0;opacity:.85}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}

/* lesson view */
.lv-head{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.lv-head h1{font-size:1.25rem;font-weight:900}
.lv-head small{color:var(--muted);display:block}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;box-shadow:var(--shadow);margin:14px 0;position:sticky;top:calc(env(safe-area-inset-top,0) + 6px);z-index:5}
.tab{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font:800 .95rem var(--h);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--pri);color:#fff}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{display:flex;gap:10px;align-items:flex-start}
.pts li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--sun);margin-top:9px;box-shadow:0 0 0 4px #fff4d6}
.explain{white-space:pre-line}
.tipbox{background:#fff4d6;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-weight:700;color:#7a4b00}

/* flashcards */
.fc{perspective:1000px;height:300px;margin:6px 0 12px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.fc-f{background:linear-gradient(160deg,var(--pri2),var(--pri));color:#fff}
.fc-b{background:var(--card);transform:rotateY(180deg)}
.fc-f b,.fc-b b{font:800 1.25rem/1.6 var(--h)}
.fc small{opacity:.75;margin-top:14px;font-size:.85rem}
.fcnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fcnav .btn{width:auto;flex:1}
.fcnav span{font:800 1rem var(--h);color:var(--muted);flex:none}

/* quiz */
.qbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width .3s}
.qq{font:800 1.12rem/1.7 var(--h);margin:4px 0 12px}
.opt{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;text-align:start;font-weight:700;display:flex;gap:10px;align-items:center}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:#eeecff;color:var(--pri);display:grid;place-items:center;font:800 .95rem var(--h)}
.opt.ok{border-color:var(--mint);background:#e6fbf3}.opt.ok .k{background:var(--mint);color:#fff}
.opt.no{border-color:var(--bad);background:#fdecec}.opt.no .k{background:var(--bad);color:#fff}
.why{background:#eeecff;border-radius:16px;padding:12px 14px;font-size:.95rem}
.result{text-align:center;padding:10px 0}
.result .big{font:900 3rem var(--h);color:var(--pri)}
.result .stars{font-size:2rem;letter-spacing:4px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(40,30,120,.12);padding:0 10px env(safe-area-inset-bottom,0);height:calc(72px + env(safe-area-inset-bottom,0))}
.bar button{border:0;background:none;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:700 .78rem var(--h)}
.bar button svg{width:26px;height:26px}
.bar button[aria-current="true"]{color:var(--pri)}
.bar .mid span.plus{width:62px;height:62px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#ffd75e,#ff9f1c);border:5px solid var(--bg);box-shadow:0 8px 20px rgba(255,159,28,.5);font-size:1.7rem}
.foot{text-align:center;color:var(--muted);font-size:.82rem;margin:22px 0 6px;line-height:1.9}
.foot a{color:inherit}
.setrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:8px;text-align:start;text-decoration:none;color:inherit;font-weight:700}
.setrow i{font-style:normal;font-size:1.3rem;width:28px;text-align:center}
.setrow span{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <section id="v-home">
    <div class="hero">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 10.5 16 5l12 5.5L16 16z" fill="#2b2a8c"/><path d="M9 13.2v5.6c0 2.2 3.2 4 7 4s7-1.8 7-4v-5.6L16 16.4z" fill="#3b37c9"/><path d="M27 11v7" stroke="#2b2a8c" stroke-width="2" stroke-linecap="round"/><circle cx="27" cy="19.5" r="1.8" fill="#2b2a8c"/></svg></div>
        <div><b>الطالب الذكي</b><small>ذاكِر وراجع قبل الاختبار</small></div>
        <span class="sp"></span>
        <button class="iconbtn" id="setBtn" type="button" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <div class="hi">
        <h1 id="hiT">أهلًا يا بطل 👋</h1>
        <p>صوّر صفحة من كتابك، وأنا أسوي لك ملخص وبطاقات مراجعة واختبار قصير.</p>
        <div class="left" id="leftBox"><i>⭐</i><span id="leftT">باقي لك 3 دروس اليوم</span></div>
      </div>
    </div>

    <div class="acts">
      <button class="act cam" type="button" id="camBtn"><span class="ic">📸</span><b>صوّر درس</b><small>صفحة من الكتاب أو الدفتر</small></button>
      <button class="act txt" type="button" id="txtBtn"><span class="ic">✍️</span><b>اكتب موضوع</b><small>مثل: الكسور العشرية</small></button>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>

    <div class="sec"><h2>📚 دروسي</h2><small id="cnt"></small></div>
    <div id="list"></div>

    <div class="foot">الطالب الذكي · سلطنة عُمان · © سالم الجابري<br>
      <a href="privacy.html">الخصوصية</a> · <a href="support.html">الدعم</a> · <a href="https://techlights.app" target="_blank" rel="noopener" dir="ltr">techlights.app</a></div>
  </section>

  <section id="v-lesson" hidden>
    <div class="lv-head" style="margin-top:14px">
      <button class="back" type="button" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div style="min-width:0"><h1 id="lvT"></h1><small id="lvS"></small></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="sum" aria-selected="true">📝 الملخص</button>
      <button class="tab" role="tab" data-t="cards" aria-selected="false">🃏 البطاقات</button>
      <button class="tab" role="tab" data-t="quiz" aria-selected="false">✅ الاختبار</button>
    </div>
    <div id="lvBody"></div>
  </section>
</div>

<nav class="bar" aria-label="القائمة">
  <button type="button" data-go="home" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button type="button" class="mid" data-go="new"><span class="plus">📸</span>درس جديد</button>
  <button type="button" data-go="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.2-3.7 4-5.5 7.5-5.5s6.3 1.8 7.5 5.5"/></svg>حسابي</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const CFG = window.SS_CFG || {};
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [x, v] of Object.entries(a)){ if(x === 'class') e.className = v; else if(x === 'text') e.textContent = v; else if(x === 'html') e.innerHTML = v; else if(x.startsWith('on')) e[x] = v; else if(v !== false && v != null) e.setAttribute(x, v === true ? '' : v); } k.flat().forEach(c => c != null && e.append(c)); return e; };
const LS = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 3000); }
const today = () => new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Muscat' });

const SUBJ = [['رياضيات','➗'],['علوم','🔬'],['فيزياء','🧲'],['كيمياء','⚗️'],['أحياء','🌱'],['لغة عربية','📖'],['لغة إنجليزية','🔤'],['دراسات اجتماعية','🌍'],['تربية إسلامية','🕌'],['تقنية المعلومات','💻'],['أخرى','📘']];
const GRADES = ['الصف الخامس','الصف السادس','الصف السابع','الصف الثامن','الصف التاسع','الصف العاشر','الصف الحادي عشر','الصف الثاني عشر'];
const subIcon = s => (SUBJ.find(x => x[0] === s) || ['', '📘'])[1];
const LIMIT = 3;

let DEV = LS.get('ss-dev', '');
if(!/^[a-z0-9-]{16,64}$/i.test(DEV)){ DEV = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))); LS.set('ss-dev', DEV); }
let LESSONS = LS.get('ss-lessons', []);
let PREF = LS.get('ss-pref', { subject:'رياضيات', grade:'الصف الثامن', name:'' });
const saveL = () => LS.set('ss-lessons', LESSONS);

function used(){ const u = LS.get('ss-used', {}); return u.d === today() ? u.n : 0; }
function setLeft(left){ LS.set('ss-used', { d:today(), n:Math.max(0, LIMIT - left) }); drawLeft(); }
function drawLeft(){ const l = Math.max(0, LIMIT - used()); $('leftT').textContent = l ? 'باقي لك ' + l + (l === 1 ? ' درس' : l === 2 ? ' درسين' : ' دروس') + ' اليوم' : 'خلصت دروس اليوم، تعال بكرة 🌙'; }

/* ---------- home ---------- */
function drawHome(){
  $('hiT').textContent = 'أهلًا ' + (PREF.name ? PREF.name : 'يا بطل') + ' 👋';
  drawLeft();
  const L = $('list'); L.replaceChildren();
  $('cnt').textContent = LESSONS.length ? LESSONS.length + ' درس' : '';
  if(!LESSONS.length){
    L.append(el('div', { class:'card empty' }, el('div', { class:'big', text:'🎒' }), el('p', { text:'ما عندك دروس للحين. صوّر أول درس وخلنا نراجعه مع بعض!' }), el('button', { class:'btn ghost', type:'button', text:'👀 شوف مثال', onclick:() => openLesson(sample(), true) })));
    return;
  }
  LESSONS.forEach(x => {
    const days = x.exam ? Math.ceil((new Date(x.exam) - new Date(today())) / 864e5) : null;
    L.append(el('button', { class:'lrow', type:'button', onclick:() => openLesson(x) },
      el('span', { class:'sub', text:subIcon(x.subject) }),
      el('div', { style:'min-width:0' }, el('b', { text:x.title }), el('span', { text:(x.subject || '') + ' · ' + new Date(x.t).toLocaleDateString('ar-OM-u-nu-latn', { day:'numeric', month:'long' }) })),
      days != null && days >= 0 ? el('span', { class:'sc exam', text:days === 0 ? 'الاختبار اليوم!' : 'باقي ' + days + ' يوم' }) : x.best != null ? el('span', { class:'sc num', text:x.best + '/' + x.quiz.length }) : null));
  });
}

/* ---------- new lesson ---------- */
function sheet(build){
  const scrim = el('div', { class:'scrim' }), s = el('div', { class:'sheet', role:'dialog' });
  const close = () => scrim.remove();
  scrim.onclick = e => { if(e.target === scrim) close(); };
  scrim.append(s); document.body.append(scrim); build(s, close); return close;
}
function chips(list, cur, on){
  const box = el('div', { class:'chips' });
  const draw = v => box.replaceChildren(...list.map(([k, ic]) => el('button', { class:'chip', type:'button', 'aria-pressed':String(k === v), text:(ic ? ic + ' ' : '') + k, onclick:() => { on(k); draw(k); } })));
  draw(cur); return box;
}
function resize(file){
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1400, r = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82)); };
    img.onerror = () => no(new Error('img')); img.src = url;
  });
}
function newLesson(image){
  if(used() >= LIMIT) return toast('خلصت دروس اليوم المجانية 🌙 تعال بكرة');
  sheet((s, close) => {
    let subject = PREF.subject, grade = PREF.grade;
    const topic = el('textarea', { class:'inp', maxlength:400, placeholder:image ? 'اختياري: اكتب اسم الدرس أو ملاحظة' : 'اكتب اسم الدرس، مثل: الكسور العشرية، أو الخلية النباتية' });
    const gsel = el('select', { class:'inp' }, GRADES.map(g => el('option', { value:g, text:g })));
    gsel.value = grade; gsel.onchange = () => grade = gsel.value;
    const exam = el('input', { class:'inp', type:'date', min:today() });
    const go = el('button', { class:'btn sun', type:'button', text:'✨ جهّز لي المراجعة' });
    s.append(el('h3', { text:image ? '📸 درس من صورة' : '✍️ درس من موضوع' }),
      image ? el('img', { class:'prev', src:image, alt:'صورة الدرس' }) : null,
      el('div', {}, el('span', { class:'lbl', text:'المادة' }), chips(SUBJ, subject, v => subject = v)),
      el('div', { class:'row2' }, el('div', {}, el('span', { class:'lbl', text:'الصف' }), gsel), el('div', {}, el('span', { class:'lbl', text:'موعد الاختبار (اختياري)' }), exam)),
      el('div', {}, el('span', { class:'lbl', text:image ? 'ملاحظة' : 'الموضوع' }), topic),
      go, el('p', { class:'hint', text:'🔒 الصورة تروح للتحليل بس وما تنحفظ عندنا. الدروس تنحفظ في جوالك.' }));
    go.onclick = async () => {
      const t = topic.value.trim();
      if(!image && t.length < 3) return toast('اكتب اسم الدرس أول');
      PREF.subject = subject; PREF.grade = grade; LS.set('ss-pref', PREF);
      close(); await ask({ image, topic:t, subject, grade, exam:exam.value || '' });
    };
  });
}
async function ask(req){
  const ld = el('div', { class:'loading' }, el('div', { class:'orb', text:'🧠' }), el('h2', { text:'الطالب الذكي يقرأ الدرس…' }), el('p', { text:'يجهز لك الملخص والبطاقات والاختبار' }));
  document.body.append(ld);
  try{
    const r = await fetch(CFG.url + '/functions/v1/' + CFG.fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:CFG.key, Authorization:'Bearer ' + CFG.key }, body:JSON.stringify({ device:DEV, image:req.image || '', topic:req.topic, subject:req.subject, grade:req.grade }) });
    const j = await r.json().catch(() => ({}));
    if(typeof j.left === 'number') setLeft(j.left);
    if(!r.ok || !j.ok){
      const m = { limit:'خلصت دروس اليوم المجانية 🌙 تعال بكرة', not_study:'الصورة ما فيها درس واضح 🤔 صوّر صفحة من الكتاب بإضاءة زينة', no_key:'الخدمة قيد التجهيز، جرّب بعد شوي', too_big:'الصورة كبيرة، جرّب صورة ثانية', ai:'صار ضغط على الخدمة، جرّب بعد دقيقة' }[j.error];
      throw new Error(m || 'ما قدرنا نجهز الدرس، تأكد من النت وجرّب مرة ثانية');
    }
    const x = Object.assign({ id:'L' + Date.now().toString(36), t:Date.now(), exam:req.exam, best:null }, j.lesson);
    if(!x.subject) x.subject = req.subject;
    LESSONS.unshift(x); LESSONS = LESSONS.slice(0, 60); saveL();
    ld.remove(); drawHome(); openLesson(x);
  }catch(e){ ld.remove(); toast(e.message); }
}

/* ---------- lesson view ---------- */
let CUR = null, DEMO = false;
function openLesson(x, demo){
  CUR = x; DEMO = !!demo;
  $('v-home').hidden = true; $('v-lesson').hidden = false; scrollTo(0, 0);
  $('lvT').textContent = x.title; $('lvS').textContent = subIcon(x.subject) + ' ' + (x.subject || '') + (demo ? ' · مثال' : '');
  tab('sum');
}
function home(){ $('v-lesson').hidden = true; $('v-home').hidden = false; drawHome(); scrollTo(0, 0); }
$('backBtn').onclick = home;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => tab(b.dataset.t));
function tab(t){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  const B = $('lvBody'); B.replaceChildren();
  if(t === 'sum') drawSum(B); else if(t === 'cards') drawCards(B); else drawQuiz(B);
}
function drawSum(B){
  const x = CUR;
  B.append(el('div', { class:'card' }, el('h3', { text:'⭐ أهم النقاط', style:'margin-bottom:10px' }), el('ul', { class:'pts' }, x.summary.map(p => el('li', { text:p })))));
  if(x.explain) B.append(el('div', { class:'card' }, el('h3', { text:'💡 الشرح المبسّط', style:'margin-bottom:8px' }), el('p', { class:'explain', style:'margin:0', text:x.explain })));
  if(x.tip) B.append(el('div', { class:'tipbox' }, el('span', { text:'🎯' }), el('span', { text:x.tip })));
  B.append(el('button', { class:'btn', type:'button', style:'margin-top:14px', text:'🃏 ابدأ بالبطاقات', onclick:() => tab('cards') }));
  if(!DEMO) B.append(el('button', { class:'btn ghost', type:'button', style:'margin-top:10px', text:'🗑️ حذف الدرس', onclick:e => { if(!e.target.dataset.sure){ e.target.dataset.sure = 1; e.target.textContent = 'اضغط مرة ثانية للتأكيد'; return; } LESSONS = LESSONS.filter(l => l.id !== CUR.id); saveL(); home(); toast('انحذف الدرس'); } }));
}
function drawCards(B){
  const C = CUR.cards; let i = 0;
  if(!C.length) return B.append(el('div', { class:'card empty', text:'ما فيه بطاقات لهذا الدرس' }));
  const fc = el('div', { class:'fc' }), cnt = el('span', { class:'num', dir:'ltr' });
  const draw = () => {
    fc.classList.remove('flip');
    fc.replaceChildren(el('div', { class:'fc-in', onclick:() => fc.classList.toggle('flip') },
      el('div', { class:'fc-f' }, el('b', { text:C[i].q }), el('small', { text:'اضغط عشان تشوف الجواب 👆' })),
      el('div', { class:'fc-b' }, el('b', { text:C[i].a }), el('small', { text:'اضغط عشان ترجع للسؤال' }))));
    cnt.textContent = (i + 1) + ' / ' + C.length;
  };
  B.append(fc, el('div', { class:'fcnav' },
    el('button', { class:'btn ghost', type:'button', text:'→ السابقة', onclick:() => { i = (i - 1 + C.length) % C.length; draw(); } }), cnt,
    el('button', { class:'btn', type:'button', text:'التالية ←', onclick:() => { i = (i + 1) % C.length; draw(); } })),
    el('button', { class:'btn sun', type:'button', style:'margin-top:14px', text:'✅ جاهز؟ ابدأ الاختبار', onclick:() => tab('quiz') }));
  draw();
}
function drawQuiz(B){
  const Q = CUR.quiz; let i = 0, score = 0;
  if(!Q.length) return B.append(el('div', { class:'card empty', text:'ما فيه أسئلة لهذا الدرس' }));
  const K = ['أ','ب','ج','د'];
  const step = () => {
    B.replaceChildren();
    if(i >= Q.length){
      const pct = score / Q.length, stars = pct >= .9 ? 3 : pct >= .6 ? 2 : pct > 0 ? 1 : 0;
      if(!DEMO){ const l = LESSONS.find(z => z.id === CUR.id); if(l){ l.best = Math.max(l.best || 0, score); saveL(); } }
      B.append(el('div', { class:'card result' }, el('div', { class:'stars', text:'⭐'.repeat(stars) + '☆'.repeat(3 - stars) }), el('div', { class:'big num', text:score + ' / ' + Q.length }),
        el('p', { text:pct >= .9 ? 'ممتاز يا بطل! أنت جاهز للاختبار 🏆' : pct >= .6 ? 'زين! راجع البطاقات مرة وبتصير ممتاز 💪' : 'ولا يهمك، راجع الملخص والبطاقات وجرّب مرة ثانية 🌱' })),
        el('button', { class:'btn', type:'button', text:'🔁 أعد الاختبار', onclick:() => { i = 0; score = 0; step(); } }),
        el('button', { class:'btn ghost', type:'button', style:'margin-top:10px', text:'📝 ارجع للملخص', onclick:() => tab('sum') }));
      return;
    }
    const q = Q[i]; let done = false;
    const opts = q.options.map((o, k) => el('button', { class:'opt', type:'button', onclick:() => {
      if(done) return; done = true;
      const right = k === q.answer; if(right) score++;
      opts.forEach((b, j) => { if(j === q.answer) b.classList.add('ok'); else if(j === k) b.classList.add('no'); });
      B.append(el('div', { class:'why' }, el('b', { text:right ? '✅ صح! ' : '❌ الإجابة الصحيحة: ' + q.options[q.answer] + '. ' }), q.why || ''),
        el('button', { class:'btn', type:'button', style:'margin-top:12px', text:i + 1 < Q.length ? 'السؤال التالي ←' : '🏁 شوف النتيجة', onclick:() => { i++; step(); } }));
    } }, el('span', { class:'k', text:K[k] }), el('span', { text:o })));
    B.append(el('div', { class:'qbar' }, el('i', { style:'width:' + (i / Q.length * 100) + '%' })), el('p', { class:'hint', text:'سؤال ' + (i + 1) + ' من ' + Q.length }), el('div', { class:'qq', text:q.q }), ...opts);
  };
  step();
}

/* ---------- settings ---------- */
function settings(){
  sheet((s, close) => {
    const nm = el('input', { class:'inp', maxlength:20, placeholder:'اسمك الأول (اختياري)', value:PREF.name || '' });
    s.append(el('h3', { text:'👤 حسابي' }),
      el('div', {}, el('span', { class:'lbl', text:'وش نناديك؟' }), nm),
      el('button', { class:'btn', type:'button', text:'حفظ', onclick:() => { PREF.name = nm.value.trim(); LS.set('ss-pref', PREF); close(); drawHome(); toast('انحفظ ✓'); } }),
      el('a', { class:'setrow', href:'privacy.html' }, el('i', { text:'🔒' }), el('span', { text:'الخصوصية وسلامة الطلاب' })),
      el('a', { class:'setrow', href:'support.html' }, el('i', { text:'💬' }), el('span', { text:'الدعم والتواصل' })),
      el('button', { class:'setrow', type:'button', onclick:() => { if(!confirm('تبي تحذف كل دروسك من هذا الجوال؟')) return; LESSONS = []; saveL(); close(); drawHome(); toast('انحذفت كل الدروس'); } }, el('i', { text:'🗑️' }), el('span', { text:'حذف كل دروسي' })),
      el('p', { class:'hint', style:'text-align:center', text:'الطالب الذكي · الإصدار 1.0 · © سالم الجابري، مسقط' }),
      el('button', { class:'btn ghost', type:'button', text:'إغلاق', onclick:close }));
  });
}

/* ---------- wiring ---------- */
$('camBtn').onclick = () => { if(used() >= LIMIT) return toast('خلصت دروس اليوم المجانية 🌙 تعال بكرة'); $('file').click(); };
$('txtBtn').onclick = () => newLesson('');
$('setBtn').onclick = settings;
$('file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return; try{ newLesson(await resize(f)); }catch(_){ toast('ما قدرنا نقرأ الصورة'); } };
document.querySelector('.bar').onclick = e => {
  const b = e.target.closest('[data-go]'); if(!b) return;
  if(b.dataset.go === 'home') home(); else if(b.dataset.go === 'new') $('camBtn').click(); else settings();
};

      {q:'الفجوة العصارية في الخلية النباتية…',options:['صغيرة جدًا','غير موجودة','كبيرة الحجم','تصنع الغذاء'],answer:2,why:'فجوة كبيرة تخزن الماء وتحافظ على صلابة الخلية.'},
      {q:'الجزء الذي يتحكم في أنشطة الخلية هو…',options:['النواة','الجدار الخلوي','الفجوة','البلاستيدات'],answer:0,why:'النواة مركز التحكم وفيها المادة الوراثية.'},
      {q:'لماذا أوراق النبات خضراء؟',options:['بسبب الماء','بسبب الكلوروفيل','بسبب الجدار الخلوي','بسبب النواة'],answer:1,why:'الكلوروفيل صبغة خضراء داخل البلاستيدات.'}],
